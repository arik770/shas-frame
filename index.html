<style>
  :root{
    --navy:#000031;
    --navy2:#0b0b4a;
    --gold:#d9b25a;
    --white:#ffffff;
    --muted:#b9bdd9;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;background:var(--navy);color:var(--white);
    font-family:"Heebo",system-ui,-apple-system,"Segoe UI",Arial,sans-serif;}
  body{min-height:100vh;display:flex;flex-direction:column;align-items:center;
    padding:max(16px,env(safe-area-inset-top)) 16px max(24px,env(safe-area-inset-bottom));}
  h1{font-size:clamp(22px,6vw,30px);font-weight:800;margin:6px 0 2px;text-align:center}
  .sub{color:var(--muted);font-size:15px;margin:0 0 14px;text-align:center}
  .stage{position:relative;width:min(100%,480px);aspect-ratio:1/1;border-radius:14px;overflow:hidden;
    box-shadow:0 0 0 2px rgba(255,255,255,.12),0 12px 40px rgba(0,0,0,.5);}
  canvas#editor{width:100%;height:100%;display:block;touch-action:none;cursor:grab;user-select:none;-webkit-user-select:none}
  canvas#editor.dragging{cursor:grabbing}
  .placeholder{position:absolute;inset:0 0 30% 0;display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:8px;color:var(--muted);font-size:17px;pointer-events:none;text-align:center;padding:20px}
  .placeholder .ic{font-size:44px;opacity:.8}
  .badge{position:absolute;top:10px;left:50%;transform:translate(-50%,-8px);background:var(--gold);color:var(--navy);
    font-weight:800;font-size:14px;padding:5px 14px;border-radius:999px;opacity:0;transition:.18s;pointer-events:none}
  .badge.show{opacity:1;transform:translate(-50%,0)}
  .hint{color:var(--muted);font-size:13.5px;margin:10px 0 0;text-align:center;line-height:1.5}
  .row{display:flex;gap:10px;width:min(100%,480px);margin-top:14px}
  .btn{flex:1;border:0;border-radius:12px;padding:14px 10px;font:inherit;font-size:16px;font-weight:600;cursor:pointer;
    display:flex;align-items:center;justify-content:center;gap:8px;transition:transform .08s,opacity .2s}
  .btn:active{transform:scale(.97)}
  .btn.ghost{background:rgba(255,255,255,.1);color:var(--white);box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.25)}
  .btn.primary{background:linear-gradient(180deg,#f0d084,var(--gold));color:var(--navy);font-weight:800;font-size:18px}
  .btn:disabled{opacity:.4;cursor:default}
  input[type=file]{display:none}

  .modal{position:fixed;inset:0;background:rgba(0,0,20,.82);display:none;align-items:center;justify-content:center;padding:16px;z-index:10;
    backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px)}
  .modal.open{display:flex}
  .sheet{background:var(--navy2);border-radius:18px;padding:16px;width:min(100%,440px);position:relative;
    box-shadow:0 0 0 1.5px rgba(255,255,255,.15),0 20px 60px rgba(0,0,0,.6)}
  .sheet h2{margin:0 0 12px;font-size:20px;text-align:center}
  .sheet img{width:100%;aspect-ratio:1/1;display:block;border-radius:10px;background:var(--navy)}
  .close{position:absolute;top:10px;left:10px;width:36px;height:36px;border-radius:50%;border:0;background:rgba(255,255,255,.12);
    color:#fff;font-size:20px;cursor:pointer;line-height:36px}
  .toast{position:fixed;bottom:max(24px,env(safe-area-inset-bottom));left:50%;transform:translate(-50%,20px);background:#fff;color:var(--navy);
    padding:10px 18px;border-radius:999px;font-weight:600;opacity:0;transition:.25s;z-index:20;pointer-events:none;text-align:center;max-width:90vw}
  .toast.show{opacity:1;transform:translate(-50%,0)}
</style>

<body>

<h1>דרך אמונה בחרתי</h1>
<p class="sub">הכינו תמונת פרופיל משלכם</p>

<div class="stage" id="stage">
  <canvas id="editor" width="1080" height="1080"></canvas>
  <div class="placeholder" id="placeholder">
    <div class="ic">📷</div>
    <div>צלמו או העלו תמונה</div>
  </div>
  <div class="badge" id="badge">✓ באמצע</div>
</div>

<p class="hint" id="hint">גררו את התמונה עם אצבע אחת · צבטו להגדלה והקטנה<br>אפשר גם לגרור את הפס התחתון ימינה ושמאלה<br>העיגול מסמן מה יופיע בתמונת הפרופיל בוואטסאפ</p>

<div class="row">
  <button class="btn ghost" id="btnCamera">📷 צילום</button>
  <button class="btn ghost" id="btnUpload">🖼️ העלאה מהמכשיר</button>
</div>
<div class="row">
  <button class="btn primary" id="btnSave" disabled>שמירת התמונה</button>
</div>

<input type="file" id="fileCamera" accept="image/*" capture="user">
<input type="file" id="fileUpload" accept="image/*">

<div class="modal" id="modal">
  <div class="sheet">
    <button class="close" id="btnClose" aria-label="סגירה">✕</button>
    <h2>התמונה מוכנה!</h2>
    <img id="preview" alt="תמונת הפרופיל המוכנה">
    <div class="row">
      <button class="btn ghost" id="btnDownload">⬇️ להורדה</button>
      <button class="btn primary" id="btnShare">שתף</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

      c.beginPath();
      c.rect(0, 0, SIZE, SIZE);
      c.arc(SIZE/2, SIZE/2, SIZE/2, 0, Math.PI*2);
      c.fillStyle = 'rgba(0,0,0,.16)';
      c.fill('evenodd');
      c.beginPath();
      c.arc(SIZE/2, SIZE/2, SIZE/2 - 1.5, 0, Math.PI*2);
      c.strokeStyle = 'rgba(255,255,255,.28)';
      c.lineWidth = 2.5;
      c.stroke();
      c.restore();
    }

    if (guides && bandActive){
      c.save();
      c.strokeStyle = bandSnapped ? '#d9b25a' : 'rgba(255,255,255,.45)';
      c.lineWidth = bandSnapped ? 5 : 3;
      if (!bandSnapped) c.setLineDash([14, 12]);
      c.beginPath(); c.moveTo(SIZE/2, 0); c.lineTo(SIZE/2, SIZE); c.stroke();
      c.restore();
    }
  }
  group.onload = requestDraw;

  // ---------- גבולות ----------
  function clampScale(v){ return Math.min(base*MAX_FACTOR, Math.max(base*MIN_FACTOR, v)); }
  function clampPos(){
    if (!photo) return;
    const w = photo.width * s, h = photo.height * s;
    // קטנה מהמסגרת – נשארת כולה בפנים; גדולה מהמסגרת – ממלאת אותה
    const xa = w/2, xb = FRAME.w - w/2;
    const ya = h/2, yb = FRAME.h - h/2;
    cx = Math.min(Math.max(xa, xb), Math.max(Math.min(xa, xb), cx));
    cy = Math.min(Math.max(ya, yb), Math.max(Math.min(ya, yb), cy));
  }
  function zoomAt(px, py, newS){
    newS = clampScale(newS);
    const ux = (px - cx) / s, uy = (py - cy) / s;
    s = newS;
    cx = px - ux * s; cy = py - uy * s;
    clampPos();
  }

  // ---------- טעינת תמונה ----------
  function loadFile(file){
    if (!file) return;
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => {
      const MAX = 2400;
      const k = Math.min(1, MAX / Math.max(img.naturalWidth, img.naturalHeight));
      const c = document.createElement('canvas');
      c.width = Math.round(img.naturalWidth * k);
      c.height = Math.round(img.naturalHeight * k);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url);
      photo = c;
      base = Math.max(FRAME.w / c.width, FRAME.h / c.height);
      s = base; cx = FRAME.w / 2; cy = FRAME.h / 2;
      document.getElementById('placeholder').style.display = 'none';
      document.getElementById('btnSave').disabled = false;
      requestDraw();
    };
    img.onerror = () => { URL.revokeObjectURL(url); toast('לא הצלחנו לפתוח את התמונה'); };
    img.src = url;
  }
  const fileCamera = document.getElementById('fileCamera');
  const fileUpload = document.getElementById('fileUpload');
  document.getElementById('btnCamera').onclick = () => fileCamera.click();
  document.getElementById('btnUpload').onclick = () => fileUpload.click();
  [fileCamera, fileUpload].forEach(inp => inp.addEventListener('change', e => {
    loadFile(e.target.files[0]); e.target.value = '';
  }));

  // ---------- מגע ועכבר ----------
  const pointers = new Map();
  let mode = null;   // 'photo' | 'band' | 'pinch'
  let last = null, pinch = null, bandStart = null;

  function toCanvas(e){
    const r = cv.getBoundingClientRect();
    return { x: (e.clientX - r.left) * SIZE / r.width, y: (e.clientY - r.top) * SIZE / r.height };
  }
  function startSingle(p){
    if (p.y >= BAND_Y){
      mode = 'band'; bandActive = true;
      bandStart = { x: p.x, bx: bandX };
      updateSnap(bandX);
    } else if (photo){
      mode = 'photo'; last = p;
    } else mode = null;
  }
  function startPinch(){
    const [a, b] = [...pointers.values()];
    pinch = { d: Math.hypot(a.x-b.x, a.y-b.y) || 1, s0: s,
              ux: ((a.x+b.x)/2 - cx) / s, uy: ((a.y+b.y)/2 - cy) / s };
    mode = 'pinch'; endBand();
  }
  function endBand(){ if (bandActive){ bandActive = false; bandSnapped = false; showBadge(false); requestDraw(); } }

  function updateSnap(x){
    const snapped = Math.abs(x - centerBandX) < SNAP;
    if (snapped && !bandSnapped && navigator.vibrate) navigator.vibrate(15);
    bandSnapped = snapped;
    showBadge(snapped);
    return snapped ? centerBandX : x;
  }

  cv.addEventListener('pointerdown', e => {
    cv.setPointerCapture(e.pointerId);
    const p = toCanvas(e);
    pointers.set(e.pointerId, p);
    if (pointers.size === 1) startSingle(p);
    else if (pointers.size === 2 && photo) startPinch();
    cv.classList.add('dragging');
    requestDraw();
  });

  cv.addEventListener('pointermove', e => {
    if (!pointers.has(e.pointerId)) return;
    const p = toCanvas(e);
    pointers.set(e.pointerId, p);
    if (mode === 'photo' && pointers.size === 1){
      cx += p.x - last.x; cy += p.y - last.y; last = p;
      clampPos();
    } else if (mode === 'band'){
      let x = bandStart.bx + (p.x - bandStart.x);
      x = Math.min(maxBandX, Math.max(minBandX, x));
      bandX = updateSnap(x);
    } else if (mode === 'pinch' && pointers.size >= 2){
      const [a, b] = [...pointers.values()];
      const d = Math.hypot(a.x-b.x, a.y-b.y) || 1;
      s = clampScale(pinch.s0 * d / pinch.d);
      cx = (a.x+b.x)/2 - pinch.ux * s;
      cy = (a.y+b.y)/2 - pinch.uy * s;
      clampPos();
    }
    requestDraw();
  });

  function pointerEnd(e){
    if (!pointers.has(e.pointerId)) return;
    pointers.delete(e.pointerId);
    if (pointers.size === 0){
      mode = null; endBand(); cv.classList.remove('dragging');
    } else if (pointers.size === 1){
      // נשארה אצבע אחת – ממשיכים להזיז את התמונה ממנה
      const p = [...pointers.values()][0];
      if (photo){ mode = 'photo'; last = p; } else mode = null;
    } else if (pointers.size >= 2 && photo) startPinch();
    requestDraw();
  }
  cv.addEventListener('pointerup', pointerEnd);
  cv.addEventListener('pointercancel', pointerEnd);

  cv.addEventListener('wheel', e => {
    if (!photo) return;
    e.preventDefault();
    const p = toCanvas(e);
    const py = Math.min(p.y, FRAME.h);
    zoomAt(p.x, py, s * Math.exp(-e.deltaY * 0.0015));
    requestDraw();
  }, { passive: false });

  // מניעת זום של הדף בספארי
  ['gesturestart','gesturechange'].forEach(t => document.addEventListener(t, e => e.preventDefault()));

  // ---------- תג "באמצע" והודעות ----------
  const badge = document.getElementById('badge');
  function showBadge(on){ badge.classList.toggle('show', on); }
  const toastEl = document.getElementById('toast');
  let toastT;
  function toast(msg){
    toastEl.textContent = msg; toastEl.classList.add('show');
    clearTimeout(toastT); toastT = setTimeout(() => toastEl.classList.remove('show'), 2600);
  }

  // ---------- שמירה ----------
  const modal = document.getElementById('modal');
  const preview = document.getElementById('preview');
  let outBlob = null, outUrl = null;

  document.getElementById('btnSave').onclick = () => {
    const out = document.createElement('canvas');
    out.width = out.height = SIZE;
    render(out.getContext('2d'), false);
    out.toBlob(blob => {
      outBlob = blob;
      if (outUrl) URL.revokeObjectURL(outUrl);
      outUrl = URL.createObjectURL(blob);
      preview.src = outUrl;
      modal.classList.add('open');
    }, 'image/jpeg', 0.92);
  };
  document.getElementById('btnClose').onclick = () => modal.classList.remove('open');
  modal.addEventListener('click', e => { if (e.target === modal) modal.classList.remove('open'); });

  function download(){
    const a = document.createElement('a');
    a.href = outUrl; a.download = FILE_NAME;
    document.body.appendChild(a); a.click(); a.remove();
  }
  document.getElementById('btnDownload').onclick = download;

  function siteLink(){ return location.href.split('#')[0].split('?')[0].replace(/index\.html$/, ''); }

  document.getElementById('btnShare').onclick = async () => {
    const text = SHARE_TEXT + '\n' + siteLink();
    const file = new File([outBlob], FILE_NAME, { type: 'image/jpeg' });
    try {
      if (navigator.canShare && navigator.canShare({ files: [file] })){
        await navigator.share({ files: [file], text });
        return;
      }
    } catch (err){
      if (err && err.name === 'AbortError') return; // המשתמש ביטל
    }
    // אין שיתוף קבצים (למשל במחשב) – מורידים ומעתיקים את הטקסט
    download();
    try { await navigator.clipboard.writeText(text); toast('התמונה ירדה והטקסט הועתק – אפשר להדביק'); }
    catch { toast('התמונה ירדה למכשיר'); }
  };

  requestDraw();
})();
</script>
</body>
</html>
